name: tests
on:
  push:
  pull_request:
jobs:
  php:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        php: ['8.2']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom
          tools: composer:v2
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: composer test
      - run: composer test-consumer
      - run: php bin/ub-php --root fixtures check --format json
