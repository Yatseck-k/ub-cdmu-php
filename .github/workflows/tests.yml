name: tests
on:
  push:
  pull_request:
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build test image
        run: docker build -t ub-cdmu-php:test .
      - name: Python tests
        run: docker run --rm --entrypoint python ub-cdmu-php:test -m pytest -q
      - name: PHP analyzer tests
        run: docker run --rm --entrypoint composer ub-cdmu-php:test test --working-dir=/app/php/analyzer
      - name: CLI environment
        run: docker run --rm ub-cdmu-php:test doctor
      - name: Fixture quality analysis
        run: docker run --rm ub-cdmu-php:test --root /app/fixtures check --format json
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - run: python -m pip install -e '.[dev]'
      - run: composer install --working-dir=php/analyzer --no-interaction --prefer-dist
      - run: python -m pytest -q
      - run: composer test --working-dir=php/analyzer
